name: Build AMD

on:
  push:
    branches: [master]
    paths:
      - 'amd/src/**'
      - '.github/workflows/amd-build.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: Check out Moodle development tooling
        run: git clone --depth 1 --branch MOODLE_405_STABLE https://github.com/moodle/moodle.git /tmp/moodle

      - name: Install Moodle Node dependencies
        working-directory: /tmp/moodle
        run: npm ci

      - name: Build plugin AMD module with Grunt
        run: |
          mkdir -p /tmp/moodle/mod/fraction
          rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/" /tmp/moodle/mod/fraction/
          cd /tmp/moodle
          npx grunt amd --root=mod/fraction
          rm -rf "$GITHUB_WORKSPACE/amd/build"
          cp -a /tmp/moodle/mod/fraction/amd/build "$GITHUB_WORKSPACE/amd/build"

      - name: Commit generated AMD build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amd/build
          if ! git diff --cached --quiet; then
            git commit -m "Build AMD module with Grunt"
            git push
          fi
